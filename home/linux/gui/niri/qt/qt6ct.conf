[Appearance]
# No custom palette. With style=kvantum the colours come from the Kvantum theme
# itself (OrchisDark.kvconfig: window #212121, base #2C2C2C, text #dfdfdf), so a
# qt6ct colour scheme on top would only override half of them and leave the
# widget geometry and the palette disagreeing.
#
# This is why the earlier `custom_palette=false` state looked light: with Fusion
# the palette came from QGenericUnixTheme (the light default) and nothing else
# supplied a dark one. Now the style plugin does.
custom_palette=false

# Papirus-Dark, not breeze-dark. Both are light-on-dark icon sets, but the
# choice is driven by a rendering bug in breeze-dark rather than by colour.
#
# breeze-dark's index.theme declares only `apps/16,apps/22,apps/32,apps/48`
# under Directories, yet its tree also ships `apps/24`. That undeclared size
# breaks Qt's size selection at HiDPI: on this 2x output, `QIcon::pixmap(53)`
# and `pixmap(106)` both return 24x24, which the launcher then scales up to 106
# physical pixels -- measured, the whole icon set is affected, not just Steam.
# Papirus-Dark declares its sizes and its @2x variants correctly, so the same
# calls return 106x106 and 212x212. Measured side by side at the launcher's
# real geometry (53 logical px, DPR 2): breeze-dark yields a 24x24 bitmap,
# Papirus-Dark a 106x106 one.
#
# The colour reasoning that originally picked breeze-dark still holds and is
# kept below, because it is the constraint any future icon-theme change has to
# satisfy. Breeze renders through `fill:currentColor` with a hardcoded
# `.ColorScheme-Text { color:#232629 }`, and QIcon has no KDE colour scheme to
# substitute, so the *light* theme always rasterises to rgb(35,37,41).
# Noctalia's bar is mSurface #111416, giving a 1.2:1 contrast ratio -- the
# glyphs are loaded and drawn, they are just invisible. Quickshell's tray
# colorize shader cannot recover that either: in tray mode (colorizeMode 1.0)
# intensity is max(r,g,b) through smoothstep(0.1, 0.9), so rgb(35,37,41) maps to
# 0.016 and the output collapses to rgb(4,4,4), darker than the surface it is
# drawn on. Only a light glyph survives that path, which is why the replacement
# is Papirus-Dark and not the light Papirus.
#
# Consequence to keep in mind: this is a light-on-dark choice. On a light
# Noctalia theme (darkMode false, mSurface near white) the same icons go
# low-contrast in the other direction and a light-theme icon set would be right.
icon_theme=Papirus-Dark

# Qt's own dialogs, drawn by the same Kvantum style as the window that opened
# them. `xdgdesktopportal` would hand them to xdg-desktop-portal-gtk instead --
# visually closer to Nautilus' picker, but it moves every Qt file dialog behind
# a portal round-trip and needs the GTK portal to be up. Measured both ways on
# this host: `default` keeps the dialog in-process and themed; the portal
# variant falls back to the *unthemed* GTK picker whenever the portal is slow
# to start after login.
standard_dialogs=default

# Kvantum, not Fusion. This is the whole point of pkgs/orchis-kde: Kvantum's
# OrchisDark theme is the Qt port of the same Orchis design the GTK side uses,
# so Qt widgets get Orchis' real geometry (12px window radius, flat buttons,
# #3281EA-family accents) instead of Fusion's approximations.
#
# The plugin that provides this style name lives in
# qt6Packages.qtstyleplugin-kvantum (lib/qt-6/plugins/styles/libkvantum.so).
# It is installed by home/linux/gui/niri/qt.nix and found through
# XDG_DATA_DIRS -> /etc/profiles/per-user/$USER/lib/qt-6/plugins, the same
# mechanism that makes libqt6ct.so resolve as a platform theme.
style=kvantum

[Fonts]
# Noto Sans 11, i.e. gtk.font in home/linux/gui/base/gtk.nix. The previous value
# was Maple Mono NF CN for *both* slots, which made every Qt window use a
# monospace face while the GTK side (Nautilus, Firefox, VS Code) used Noto Sans
# -- a font mismatch that survives any palette or style change.
general="Noto Sans,11"
# Monospace stays Maple Mono NF CN, matching the terminal.
fixed="Maple Mono NF CN,11"

[Interface]
activate_item_on_single_click=1
buttonbox_layout=0
cursor_flash_time=1000
dialog_buttons_have_icons=1
double_click_interval=400
gui_effects=@Invalid()
keyboard_scheme=2
menus_have_icons=true
show_shortcuts_in_context_menus=true
stylesheets=@Invalid()
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3

[Troubleshooting]
force_raster_widgets=1
ignored_applications=@Invalid()
