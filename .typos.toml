[files]
extend-exclude = [
  "flake.lock",
]

[default.extend-words]
# add false-positive words here

# IntelliJ "Darcula" theme name (registered by the Joplin Editor Themes
# plugin), not a misspelling of Dracula.
darcula = "darcula"

# "Sur" from WhiteSur (the macOS Big Sur theme by vinceliuice) and Big Sur
# itself; typos splits the camelCase and reads it as "Sure".
sur = "sur"

# Android's e2fsprogs fork, shipped in platform-tools; not a typo of "make".
# `extend-identifiers` rather than `extend-words`: typos splits on the digit and
# otherwise reports the "mke" fragment.
[default.extend-identifiers]
mke2fs = "mke2fs"
